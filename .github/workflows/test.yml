name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège : aucun secret, lecture seule du dépôt (les PR de forks n'en ont pas davantage).
permissions:
  contents: read

# Annule les runs concurrents pour la même branche / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest (unit tests, zero-network)
        # Les tests smoke sandbox nécessitent un PENNYLANE_API_TOKEN réel et
        # sont exclus par défaut (cf. pyproject.toml addopts "-m 'not smoke'").
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
