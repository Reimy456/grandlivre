name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège : aucun secret, lecture seule du dépôt (les PR de forks n'en ont pas davantage).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check + format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format (check only, no rewrite)
        run: ruff format --check src/ tests/

  mypy:
    name: mypy strict
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install mypy + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: mypy strict
        # Exclusion : tests/ (cf. pyproject.toml [tool.mypy]).
        run: mypy src/grandlivre

  pip-audit:
    name: pip-audit (CVE dépendances)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit

      - name: pip-audit (dépendances runtime installées)
        run: pip-audit
